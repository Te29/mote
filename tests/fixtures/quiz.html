<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mote Test Quiz</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .question { display: none; }
        .question.active { display: block; }
        button { margin-top: 20px; padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { display: none; color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Mote Agent Test Quiz</h1>
    
    <div id="q1" class="question active">
        <h2>Question 1: What does AI stand for?</h2>
        <label><input type="radio" name="q1" value="a"> Apple Inc.</label><br>
        <label><input type="radio" name="q1" value="b"> Artificial Intelligence</label><br>
        <label><input type="radio" name="q1" value="c"> Alien Invasion</label><br>
        <button onclick="next(1)">Next</button>
    </div>

    <div id="q2" class="question">
        <h2>Question 2: Which is a browser automation tool?</h2>
        <label><input type="radio" name="q2" value="a"> Playwright</label><br>
        <label><input type="radio" name="q2" value="b"> Microsoft Word</label><br>
        <label><input type="radio" name="q2" value="c"> Photoshop</label><br>
        <button onclick="next(2)">Next</button>
    </div>

    <div id="q3" class="question">
        <h2>Question 3: Is this test passing?</h2>
        <label><input type="radio" name="q3" value="a"> No</label><br>
        <label><input type="radio" name="q3" value="b"> Yes</label><br>
        <button onclick="finish()">Submit</button>
    </div>

    <div id="result" class="result">
        <h2>Quiz Complete!</h2>
        <p>You scored 3/3.</p>
    </div>

    <script>
        function next(current) {
            document.getElementById('q' + current).classList.remove('active');
            document.getElementById('q' + (current + 1)).classList.add('active');
        }
        function finish() {
            document.getElementById('q3').classList.remove('active');
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
